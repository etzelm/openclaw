name: Mac focus week proof

# Real-behavior proof for the Mac focus week PRs on a disposable GitHub-hosted
# macOS runner: build the packaged app from each PR head (ad-hoc signed, no
# notarization), run it against a job-owned loopback Gateway, drive the
# scenario in scripts/mac-proof/<item>.sh, capture the real window, upload.
# Never contacts a real Gateway; every token is generated per job.
#
# Triggers: a push to mac/proof-pipeline runs every entry. After that first run
# the workflow is registered, so `gh workflow run --ref mac/proof-pipeline`
# can dispatch single entries without the file on the default branch.

on:
  push:
    branches: [mac/proof-pipeline]
    paths:
      - .github/workflows/mac-focus-week-proof.yml
      - scripts/mac-proof/**
  workflow_dispatch:
    inputs:
      items:
        description: Comma-separated entries or items (5a,5b,6,3-head,3-base,4a-head,4a-base,4b,9) or all
        required: false
        default: all
        type: string

permissions:
  contents: read

concurrency:
  group: mac-focus-week-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "24.22.1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ITEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.items || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          all='[
            {"id":"5a","item":"5a","pr":185432,"ref":"mac/5a-tab-load-error","variant":"head","app":true},
            {"id":"5b","item":"5b","pr":185437,"ref":"mac/5b-tab-crash-budget","variant":"head","app":true},
            {"id":"6","item":"6","pr":185433,"ref":"mac/6-widget-links","variant":"head","app":true},
            {"id":"3-head","item":"3","pr":185434,"ref":"mac/3-exec-drop","variant":"head","app":true},
            {"id":"3-base","item":"3","pr":185434,"ref":"mac/3-exec-drop","variant":"base","app":true},
            {"id":"4a-head","item":"4a","pr":185435,"ref":"mac/4a-dashboard-preload-remote","variant":"head","app":true},
            {"id":"4a-base","item":"4a","pr":185435,"ref":"mac/4a-dashboard-preload-remote","variant":"base","app":true},
            {"id":"4b","item":"4b","pr":185436,"ref":"mac/4b-pathprepend-node","variant":"head","app":false},
            {"id":"9-head","item":"9","pr":0,"ref":"mac/9-inspect-isolated-world","variant":"head","app":true},
            {"id":"9-base","item":"9","pr":0,"ref":"mac/9-inspect-isolated-world","variant":"base","app":true}
          ]'
          matrix="$(ITEMS="$ITEMS" ALL="$all" node -e '
            const all = JSON.parse(process.env.ALL);
            const want = process.env.ITEMS.split(",").map((s) => s.trim()).filter(Boolean);
            const pick = want.includes("all") ? all : all.filter((e) => want.includes(e.id) || want.includes(e.item));
            if (pick.length === 0) { console.error("no matching entries"); process.exit(1); }
            process.stdout.write(JSON.stringify({ include: pick }));')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  proof:
    needs: plan
    name: proof ${{ matrix.id }}
    runs-on: macos-26
    timeout-minutes: 100
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      ITEM: ${{ matrix.item }}
      PR: ${{ matrix.pr }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Resolve source commit
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ matrix.ref }}
        shell: bash
        run: |
          set -euo pipefail
          fork_sha="$(gh api "repos/etzelm/openclaw/branches/$REF" --jq .commit.sha)"
          if [[ "$PR" == "0" ]]; then
            # No PR yet: the fork branch is the head and its first parent the base.
            head_sha="$fork_sha"
            base_sha="$(gh api "repos/etzelm/openclaw/commits/$fork_sha" --jq '.parents[0].sha')"
          else
            head_sha="$(gh api "repos/openclaw/openclaw/pulls/$PR" --jq .head.sha)"
            base_sha="$(gh api "repos/openclaw/openclaw/pulls/$PR" --jq .base.sha)"
          fi
          if [[ "$head_sha" != "$fork_sha" ]]; then
            echo "::error::fork $REF ($fork_sha) is not PR #$PR head ($head_sha)"
            exit 1
          fi
          if [[ "$VARIANT" == "base" ]]; then
            echo "repo=openclaw/openclaw" >> "$GITHUB_OUTPUT"
            echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          else
            echo "repo=etzelm/openclaw" >> "$GITHUB_OUTPUT"
            echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.sha }}
          persist-credentials: false

      - name: Checkout proof harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .mac-proof-harness
          persist-credentials: false

      - name: Move harness out of the source tree
        shell: bash
        run: |
          set -euo pipefail
          mv .mac-proof-harness "$RUNNER_TEMP/harness"
          test -z "$(git status --porcelain)"
          echo "HARNESS=$RUNNER_TEMP/harness" >> "$GITHUB_ENV"
          echo "SRC=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/proof-out" >> "$GITHUB_ENV"
          echo "EXPECTED_SHA=${{ steps.src.outputs.sha }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proof-out"

      - name: Select supported Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Upstream CI runs on its own xcode-27 label; the hosted macos-26 image
          # carries several Xcodes and its /Applications/Xcode.app default can lag.
          # Select the newest installed one, then let the upstream check enforce 26.4+.
          source scripts/lib/swift-toolchain.sh
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)"
          sudo xcode-select -s "${newest:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
          require_swift_toolchain

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache-mode: restore

      - name: Package app (ad-hoc signed, debug, arm64, no MLX voice)
        if: matrix.app
        env:
          BUILD_CONFIG: debug
          BUILD_ARCHS: arm64
          OPENCLAW_SKIP_MLX_TTS: "1"
          SIGN_IDENTITY: "-"
          ALLOW_ADHOC_SIGNING: "1"
          DISABLE_LIBRARY_VALIDATION: "1"
          SKIP_TEAM_ID_CHECK: "1"
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package-mac-app.sh 2>&1 | tee "$OUT/package.log" | tail -n 40
          test -d dist/OpenClaw.app
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister \
            -f dist/OpenClaw.app
          echo "APP=$GITHUB_WORKSPACE/dist/OpenClaw.app" >> "$GITHUB_ENV"

      - name: Build CLI and Gateway
        if: ${{ !matrix.app }}
        shell: bash
        run: pnpm build 2>&1 | tee "$OUT/build.log" | tail -n 20

      - name: Preflight (GUI session, capture, accessibility)
        shell: bash
        run: /bin/bash "$HARNESS/scripts/mac-proof/preflight.sh"

      - name: Run scenario ${{ matrix.id }}
        shell: bash
        # /bin/bash is the shell the runner image's TCC grants name.
        run: /bin/bash "$HARNESS/scripts/mac-proof/${ITEM}.sh"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ matrix.id }} (PR #$PR, $VARIANT)"
            echo
            echo '```'
            cat "$OUT/identity.txt" 2>/dev/null || true
            tail -n 40 "$OUT/scenario.log" 2>/dev/null || true
            echo '```'
            cat "$OUT/summary.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-proof-${{ matrix.id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 14
