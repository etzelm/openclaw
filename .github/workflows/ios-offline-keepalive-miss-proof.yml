name: ios-offline-keepalive-miss-proof

# Secretless real-Xcode proof for reconnecting after consecutive missed keepalive pongs.
# Every input (base SHA, head diff, red diff, expected head tree) is committed on this branch.
on:
  workflow_dispatch:
  push:
    branches: [proof/ios-offline-keepalive-miss]

permissions:
  contents: read

concurrency:
  group: ios-offline-keepalive-miss-proof-${{ github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  focused:
    name: GatewayNetworkPathRecoveryTests red without the fix, green on head
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select newest Xcode
        timeout-minutes: 5
        run: bash rig/select-xcode.sh
      - name: Enable pnpm
        timeout-minutes: 2
        run: corepack enable
      - name: Red (keepalive failures ignored) then green (head tree)
        timeout-minutes: 60
        run: bash rig/run.sh focused
      - name: Upload result
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-miss-focused
          path: ${{ runner.temp }}/keepalive-miss/out/focused/**
          if-no-files-found: warn
          retention-days: 90

  full-suite:
    name: full OpenClawKit swift test on head
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select newest Xcode
        timeout-minutes: 5
        run: bash rig/select-xcode.sh
      - name: Enable pnpm
        timeout-minutes: 2
        run: corepack enable
      - name: Full swift test on head tree
        timeout-minutes: 60
        run: bash rig/run.sh full
      - name: Upload result
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-miss-full-suite
          path: ${{ runner.temp }}/keepalive-miss/out/full/**
          if-no-files-found: warn
          retention-days: 90

  native:
    name: real URLSession socket, silent Gateway, base vs head
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select newest Xcode
        timeout-minutes: 5
        run: bash rig/select-xcode.sh
      - name: Enable pnpm
        timeout-minutes: 2
        run: corepack enable
      - name: Native keepalive proof, base then head
        timeout-minutes: 60
        run: bash rig/run.sh native
      - name: Upload result
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-miss-native
          path: ${{ runner.temp }}/keepalive-miss/out/native/**
          if-no-files-found: warn
          retention-days: 90

  real-gateway:
    name: shipped client vs real openclaw gateway frozen with SIGSTOP, base vs head
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select newest Xcode
        timeout-minutes: 5
        run: bash rig/select-xcode.sh
      - name: Enable pnpm
        timeout-minutes: 2
        run: corepack enable
      - name: Fetch base, install, build the Gateway
        timeout-minutes: 30
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/keepalive-miss-real/src"
          git init -q "$SRC"
          git -C "$SRC" fetch -q --depth 1 https://github.com/openclaw/openclaw.git cb73e59f9356796d4eec6ffeffff327e213355a6
          git -C "$SRC" checkout -q --detach FETCH_HEAD
          cd "$SRC"
          pnpm install --frozen-lockfile
          node scripts/prepare-apple-mermaid.mjs
          pnpm build
      - name: Real Gateway keepalive proof, base then head
        timeout-minutes: 40
        run: |
          zsh rig/real-gateway.sh "$RUNNER_TEMP/keepalive-miss-real/src"
          for side in base head; do
            echo "### $side"; echo '```'
            grep -E "KEEPALIVE_REAL_GATEWAY|Test run with|^exit" "$RUNNER_TEMP/keepalive-miss-real/out/real-gateway/real-gateway-$side.log"
            echo '```'
          done >> "$GITHUB_STEP_SUMMARY"
          grep -q "reason=gateway socket unresponsive to keepalive pings" "$RUNNER_TEMP/keepalive-miss-real/out/real-gateway/real-gateway-head.log"
      - name: Upload result
        if: always()
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: keepalive-miss-real-gateway
          path: ${{ runner.temp }}/keepalive-miss-real/out/real-gateway/**
          if-no-files-found: warn
          retention-days: 90
